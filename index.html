<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monekyfi — sua selva organizada</title>
  <meta name="description" content="Organizador de vida com tema de floresta: prompts, automações, finanças, tarefas, hábitos, metas, notas e canal.">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="hero-art" id="hero-art"></div>
      <div>
        <h1 id="saudacao">Olá!</h1>
        <p class="sub" id="data-hoje"></p>
        <p class="quote" id="banana-do-dia"></p>
      </div>
    </section>

    <section class="mt-2">
      <div class="grid grid-4" id="stats"></div>
    </section>

    <section class="mt-2">
      <h2 class="title-doodle"><span id="leaf-1"></span> Atalhos da selva</h2>
      <div class="quick-links" id="quick-links"></div>
    </section>

    <section class="mt-2 grid grid-2">
      <div class="card">
        <h3>🍃 Próximas tarefas</h3>
        <div id="proximas-tarefas"></div>
      </div>
      <div class="card alt">
        <h3>🎯 Metas em andamento</h3>
        <div id="metas-andamento"></div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
